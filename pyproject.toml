[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modu-workbench"
version = "0.3.0"
description = "墨读·工作台：本地离线的一站式阅读与转换工作台（PySide6 单应用）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8",
    "ebooklib>=0.18",      # EPUB 解析（墨读书库）
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "chardet>=5.2",
    "requests>=2.31",      # 在线书源下载
    "Pillow>=10.0",        # 图片转换
    "markdown>=3.5",       # Markdown → HTML
    "html2text>=2020.1.16",  # HTML → Markdown
    "python-docx>=1.1",    # Word(docx) 读写
    "openpyxl>=3.1",       # Excel(xlsx)
    "xlrd>=2.0.1",         # Excel(xls 旧版)
    "rarfile>=4.0",        # RAR 解压（需要系统 unrar/7z）
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
